services:
  - type: web
    name: nudge-veer
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: GEMMA_MODEL
        value: gemma-2-9b-it
